<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_iron" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#9f1239" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottleGrad_iron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="accentGrad_iron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <filter id="glow_iron" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <rect width="400" height="400" fill="transparent"/>
  <circle cx="200" cy="200" r="170" fill="url(#bgGlow_iron)"/>

  <!-- Orbital Ring Details -->
  <ellipse cx="200" cy="210" rx="140" ry="40" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.4" transform="rotate(-15 200 210)"/>
  <ellipse cx="200" cy="210" rx="120" ry="32" fill="none" stroke="#94a3b8" stroke-width="0.8" opacity="0.2" transform="rotate(-15 200 210)"/>

  <!-- Bottle Shadow -->
  <ellipse cx="200" cy="335" rx="75" ry="14" fill="#020617" opacity="0.8"/>
  <ellipse cx="200" cy="335" rx="55" ry="8" fill="#e11d48" opacity="0.2" filter="blur(6px)"/>

  <!-- Supplement Bottle Body -->
  <g transform="translate(0, -5)">
    <!-- Cap -->
    <rect x="165" y="75" width="70" height="22" rx="4" fill="#334155" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="172" y1="78" x2="172" y2="94" stroke="#64748b" stroke-width="1.5"/>
    <line x1="180" y1="78" x2="180" y2="94" stroke="#64748b" stroke-width="1.5"/>
    <line x1="188" y1="78" x2="188" y2="94" stroke="#64748b" stroke-width="1.5"/>
    <line x1="200" y1="78" x2="200" y2="94" stroke="#64748b" stroke-width="1.5"/>
    <line x1="212" y1="78" x2="212" y2="94" stroke="#64748b" stroke-width="1.5"/>
    <line x1="220" y1="78" x2="220" y2="94" stroke="#64748b" stroke-width="1.5"/>
    <line x1="228" y1="78" x2="228" y2="94" stroke="#64748b" stroke-width="1.5"/>

    <!-- Neck -->
    <rect x="175" y="97" width="50" height="15" fill="#1e293b"/>

    <!-- Bottle Base Glass Silhouette -->
    <path d="M 140 135 C 140 115, 175 112, 175 112 L 225 112 C 225 112, 260 115, 260 135 L 260 300 C 260 320, 245 328, 200 328 C 155 328, 140 320, 140 300 Z"
          fill="url(#bottleGrad_iron)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

    <!-- High-tech Label Area -->
    <rect x="146" y="145" width="108" height="150" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#e11d48" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Label Top Accent Bar -->
    <path d="M 147 153 L 253 153" stroke="url(#accentGrad_iron)" stroke-width="3" stroke-linecap="round"/>

    <!-- Label Brand Icon & Accent -->
    <circle cx="200" cy="178" r="14" fill="#e11d48" fill-opacity="0.15" stroke="#e11d48" stroke-width="1.5"/>
    <circle cx="200" cy="178" r="5" fill="#e11d48"/>

    <!-- Label Typography -->
    <text x="200" y="215" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">IRON CHELATE</text>
    <text x="200" y="232" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#fecdd3" text-anchor="middle" letter-spacing="0.8">FERROUS BISGLYCINATE</text>

    <!-- Formula Badge -->
    <rect x="156" y="250" width="88" height="18" rx="9" fill="#e11d48" fill-opacity="0.15" stroke="#e11d48" stroke-width="1"/>
    <text x="200" y="262.5" font-family="monospace" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">25 MG GENTLE</text>

    <!-- Glass Specular Reflection Highlight -->
    <path d="M 145 140 C 145 130, 155 125, 170 120 L 170 310 C 155 308, 145 300, 145 290 Z" fill="rgba(255,255,255,0.08)"/>
    <path d="M 148 150 L 148 290" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>